version: '3.8'

services:
  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edinet-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend
    networks:
      - edinet-network

  # Backend services
  backend:
    extends:
      file: ./backend/docker-compose.yml
      service: api-gateway

networks:
  edinet-network:
    driver: bridge